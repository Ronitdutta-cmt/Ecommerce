version: "3.9"

services:

          backend:
            build: ./backend
            ports:
              - "4000:4000"
            volumes:
              - ./backend:/app
              - /app/node_modules

          frontend:
            build: ./frontend
            ports:
              - "5173:5173"
            volumes:
              - ./frontend:/app
              - /app/node_modules
            depends_on:
              - backend

          admin:
            build: ./admin
            ports:
              - "5174:5173"
            volumes:
              - ./admin:/app
              - /app/node_modules
            depends_on:
              - backend